
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">

        <h1>🍅 Pomodoro Timer</h1>
        <p>Stay focused. Get things done.</p>

        <div class="modes">
            <button class="mode active" data-mode="focus">Focus</button>
            <button class="mode" data-mode="short">Short Break</button>
            <button class="mode" data-mode="long">Long Break</button>
        </div>

        <section class="timer-card">
            <h2 id="session-label">Focus Time</h2>

            <div id="timer">25:00</div>

            <div class="controls">
                <button id="start">Start</button>
                <button id="reset">Reset</button>
            </div>
        </section>

        <p class="session-info">
            Completed sessions:
            <span id="count">0</span>
        </p>

        <p id="status">Ready to focus?</p>

    </main>

    <script src="script.js"></script>
</body>
</html>
